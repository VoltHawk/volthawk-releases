name: Bug Report
description: Report an issue with VoltHawk Desktop or Radar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11 / 10 (x64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VoltHawk Version
      placeholder: e.g. v0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Steps to Reproduce & Sanitized Logs
      description: Never paste private keys, mnemonics, or API keys.
    validations:
      required: true
